name: Deploy to GCP Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 認證 GCP (加入 project_id 確保定位準確)
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        project_id: '${{ secrets.GCP_PROJECT_ID }}' # 👈 務必加入這一行

    # 2. 部署到 Cloud Functions
    - id: 'deploy'
      uses: 'google-github-actions/deploy-cloud-functions@v2'
      with:
        # 建議改回你截圖中顯示的名稱
        name: 'psychological-api' 
        runtime: 'nodejs20'
        region: 'us-central1'
        # 確保你的程式碼真的放在這個資料夾下
        source_dir: './gcp-functions' 
        # 根據你 index.js 裡的 exports.mainHandler 修改
        entry_point: 'mainHandler' 
        https_trigger_security_level: 'secure_always'
        # 修正變數鍵名，與程式碼對齊
        env_vars: |
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TIDB_HOST=${{ secrets.TIDB_HOST }}
          TIDB_USER=${{ secrets.TIDB_USER }}
          TIDB_PASSWORD=${{ secrets.TIDB_PASSWORD }}
          TIDB_DB_NAME=${{ secrets.TIDB_DB }}
          TIDB_PORT=${{ secrets.TIDB_PORT }}
