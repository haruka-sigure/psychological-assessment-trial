<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理健康深度評量</title>
    <style>
        :root { --primary: #7ef4ad; --bg: #e0f7fa; --card: #ffffff; --accent: #8a4af3; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; max-width: 600px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        /* 表單樣式 */
        textarea { width: 100%; height: 120px; margin: 15px 0; border-radius: 12px; border: 2px solid #eee; padding: 15px; font-size: 1rem; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; }
        
        /* 按鈕樣式 */
        .btn-main { background: var(--primary); border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; }
        .btn-detail { background: white; border: 2px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 10px; margin: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-detail:hover { background: var(--accent); color: white; }

        /* 結果區塊 */
        .result-container { margin-top: 25px; display: none; text-align: left; }
        .score-item { background: #f0f0f0; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .ai-report { background: #fdf2d9; padding: 20px; border-radius: 15px; border-left: 5px solid #fbc02d; margin-top: 20px; white-space: pre-wrap; }
        .detail-section { margin-top: 25px; padding-top: 20px; border-top: 1px dashed #ccc; }

        .loading { display: none; margin: 20px 0; color: #666; }
    </style>
</head>
<body>

<div class="card" id="surveyCard">
    <div id="loadingQuestions">載入題目中，請稍候...</div>
    <form id="quizForm" style="display:none;">
        <table id="questionTable">
            </table>
        <button type="button" onclick="handleFinalSubmit()">送出測驗</button>
    </form>

    <div id="resultContainer" style="display:none;">
        <h3>📊 測驗評估報告</h3>
        <div id="scoreList"></div> <hr>
        <div id="aiAdviceBox" style="background:#fdf2d9; padding:15px; border-radius:10px; margin:15px 0;">
            <h4 style="color:#8a4af3; margin-top:0;">💡 暖心導師的建議</h4>
            <p id="aiContent" style="line-height:1.6;"></p>
        </div>
        <hr>

        <div id="detailSection" style="display:none;">
            <p><strong>建議進一步了解：</strong></p>
            <div id="detailButtons"></div>
        </div>
    </div>
</div>
    
<div class="card" id="surveyCard">
    <div id="loadingQuestions">載入題目中，請稍候...</div>
    <form id="quizForm" style="display:none;">
        <table id="questionTable">
            </table>
        <button type="button" onclick="handleFinalSubmit()">送出測驗</button>
    </form>

    <div id="resultContainer" style="display:none;">
        <h3>📊 測驗評估報告</h3>
        <div id="scoreList"></div> <hr>
        <div id="aiAdviceBox" style="background:#fdf2d9; padding:15px; border-radius:10px; margin:15px 0;">
            <h4 style="color:#8a4af3; margin-top:0;">💡 暖心導師的建議</h4>
            <p id="aiContent" style="line-height:1.6;"></p>
        </div>
        <hr>

        <div id="detailSection" style="display:none;">
            <p><strong>建議進一步了解：</strong></p>
            <div id="detailButtons"></div>
        </div>
    </div>
</div>

<script>
    // 1. 頁面載入時，先去 GAS 抓題目
    window.onload = async () => {
        const GAS_URL = "你的_GAS_網址"; 
        // 建議在 GAS 的 doGet 增加一個參數，讓它回傳 JSON 題目而非 HTML
        const response = await fetch(GAS_URL + "?action=getQuestions");
        const questions = await response.json();
        renderQuestions(questions);
    };

    function renderQuestions(questions) {
        // 動態產生表格 HTML 的邏輯...
        document.getElementById('loadingQuestions').style.display = 'none';
        document.getElementById('quizForm').style.display = 'block';
    }

    // 2. 送出給 Vercel API 進行分析
    async function handleFinalSubmit() {
        // 收集答案...
        const response = await fetch('/api/analyze', {
            method: 'POST',
            body: JSON.stringify({ inputData: { answers } })
        });
        const data = await response.json();
        
        // 顯示結果與 AI 建議
        document.getElementById('quizForm').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('aiContent').innerText = data.aiAnalysis;
        // ...其餘分數渲染邏輯
    }

    function renderResults(data) {
    const resultContainer = document.getElementById('resultContainer');
    const scoreList = document.getElementById('scoreList');
    const aiAdviceBox = document.getElementById('aiAdviceBox');
    const aiContent = document.getElementById('aiContent');
    const detailSection = document.getElementById('detailSection');
    const detailButtons = document.getElementById('detailButtons');

    // 1. 顯示容器
    resultContainer.style.display = "block";

    // 2. 渲染分數 (來自 GAS 的 results)
    scoreList.innerHTML = '';
    if (data.scores && data.scores.length > 0) {
        data.scores.forEach(item => {
            const div = document.createElement('div');
            div.className = 'score-item';
            div.innerHTML = `<span>${item.dimension}</span><strong>${item.evaluation}</strong>`;
            scoreList.appendChild(div);
        });
    }

    // 3. 渲染 AI 建議 (插入在中間)
    if (data.aiAnalysis) {
        aiAdviceBox.style.display = "block";
        aiContent.innerText = data.aiAnalysis;
    } else {
        aiAdviceBox.style.display = "none";
    }

    // 4. 渲染詳細評量按鈕
    detailButtons.innerHTML = '';
    if (data.buttons && data.buttons.length > 0) {
        detailSection.style.display = "block";
        data.buttons.forEach(btnInfo => {
            const btn = document.createElement('button');
            btn.className = 'btn-detail';
            btn.innerText = btnInfo.label;
            // 這裡可以呼叫詳細問卷的邏輯
            btn.onclick = () => switchToDetailMode(btnInfo.dimension, data.detailQuestions);
            detailButtons.appendChild(btn);
        });
    } else {
        detailSection.style.display = "none";
    }

    // 5. 自動捲動到結果區，優化使用者體驗
    resultContainer.scrollIntoView({ behavior: 'smooth' });
}

    function startDetailSurvey(dimension) {
        alert("即將開始「" + dimension + "」的深度評量，請稍候...");
        // 這裡可以導向詳細問卷介面，或動態載入 data.detailQuestions
    }
</script>

</body>
</html>
