<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疾病介紹 - 響應式版本</title>
    <style>
        :root {
            --primary-bg: #e0f7fa;
            --card-bg: #fdf2d9;
            --accent-green: #7ef4ad;
            --text-color: #333;
            --purple-theme: #8a4af3;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 { font-size: 1.4rem; margin-bottom: 30px; line-height: 1.4; }

        /* --- 手機版按鈕清單 --- */
        .mobile-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mobile-btn {
            background: white;
            border: 2px solid #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mobile-btn:active { transform: scale(0.98); background: #f0f0f0; }
        .mobile-btn.active { border-color: var(--purple-theme); color: var(--purple-theme); }

        /* --- 介紹內容卡片 (手機版優化) --- */
        .info-box {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            text-align: left;
            position: relative;
            display: none; /* 初始隱藏 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            animation: slideUp 0.3s ease-out;
        }

        .info-box.show { display: block; }

        .close-x {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
        }

        .info-box h2 { margin-top: 0; color: var(--purple-theme); font-size: 1.2rem; }
        .info-box p { line-height: 1.7; color: #444; margin-bottom: 0; }

        /* --- 開始測驗按鈕 --- */
        .start-btn {
            background-color: var(--accent-green);
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 40px;
            cursor: pointer;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>在開始之前，<br>我們來聊聊這些困擾...</h1>

    <div class="mobile-list">
        <div class="mobile-btn" onclick="selectDisease(this, 'schizo')">思覺失調症</div>
        <div class="mobile-btn" onclick="selectDisease(this, 'bipolar')">躁鬱症</div>
        <div class="mobile-btn" onclick="selectDisease(this, 'depression')">憂鬱症</div>
        <div class="mobile-btn" onclick="selectDisease(this, 'autism')">自閉症</div>
        <div class="mobile-btn" onclick="selectDisease(this, 'anxiety')">焦慮症</div>
    </div>

    <div id="infoBox" class="info-box">
        <span class="close-x" onclick="closeBox()">&times;</span>
        <div id="infoDetail"></div>
    </div>

    <button class="start-btn" onclick="goToSurvey()">開始測驗</button>
</div>

<script>
    const data = {
        schizo: { title: "思覺失調症", content: "這是一種關於大腦訊息處理的慢性疾病，會影響一個人的思考、感覺與現實感的判斷。這並非「人格分裂」，透過早期篩檢與穩定治療，大腦的功能是可以被修復並重新與世界接軌的。" },
        bipolar: { title: "躁鬱症", content: "患者會經歷情緒極端高昂（躁期）與極端低落（鬱期）的循環，這不僅僅是情緒化，而是生理與心理共同影響的結果。" },
        depression: { title: "憂鬱症", content: "不僅是心情不好，而是一種持續的心境低落、失去興趣與動力，並可能伴隨睡眠與體重改變的生理疾病。" },
        autism: { title: "自閉症", content: "屬於神經發展多樣性，影響社交溝通與感官處理。每個人的表現都不同，理解與支持是接軌的關鍵。" },
        anxiety: { title: "焦慮症", content: "長期的過度擔憂與緊繃，可能伴隨心悸、手抖等生理症狀，影響日常生活與判斷力。" }
    };

    function selectDisease(element, key) {
        // 移除其他按鈕的啟動狀態
        document.querySelectorAll('.mobile-btn').forEach(btn => btn.classList.remove('active'));
        // 設定當前按鈕啟動
        element.classList.add('active');

        // 顯示內容
        const box = document.getElementById('infoBox');
        const detail = document.getElementById('infoDetail');
        detail.innerHTML = `<h2>${data[key].title}</h2><p>${data[key].content}</p>`;
        box.classList.add('show');

        // 自動捲動到說明文字，優化手機體驗
        setTimeout(() => {
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function closeBox() {
        document.getElementById('infoBox').classList.remove('show');
        document.querySelectorAll('.mobile-btn').forEach(btn => btn.classList.remove('active'));
    }
function goToSurvey() {
    const btn = document.querySelector('.start-btn');
    btn.innerText = "測驗載入中...";
    btn.disabled = true;

    // 💥 關鍵修改：不要導向 GAS URL，而是導向 Vercel 專案內的 survey.html
    window.location.href = "survey.html"; 
}
</script>

</body>
</html>
